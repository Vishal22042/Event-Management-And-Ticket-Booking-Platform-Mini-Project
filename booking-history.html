
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking History - EventHub</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/booking-history.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="navbar">

            <div class="logo">
                <img src="images/common/logo.jpg" alt="EventHub Logo">
                <span>EventHub</span>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="tickets.html">Tickets</a>
                <a href="booking.html">Booking</a>
                <a href="booking-history.html" class="active">History</a>
                <a href="contact.html">Contact</a>
            </nav>

        </div>
    </header>


    <!-- Booking History Section -->
    <main class="history-section">

        <div class="history-container">

            <h1>Booking History</h1>

            <p class="subtitle">
                View your confirmed and pending event bookings.
            </p>


            <!-- Dynamic Booking Summary -->

            <div class="summary">

                <div class="summary-box">
                    <h3 id="totalBookings">0</h3>
                    <p>Total Bookings</p>
                </div>

                <div class="summary-box confirmed-box">
                    <h3 id="confirmedBookings">0</h3>
                    <p>Confirmed</p>
                </div>

                <div class="summary-box pending-box">
                    <h3 id="pendingBookings">0</h3>
                    <p>Pending</p>
                </div>

            </div>


            <!-- Dynamic Booking List -->

            <div id="bookingList"></div>


            <!-- Back Buttons -->
            <div class="history-buttons">

                <a href="events.html" class="events-btn">
                    Explore Events
                </a>

                <a href="booking.html" class="booking-btn">
                    Make New Booking
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 EventHub. All Rights Reserved.</p>
    </footer>


    <!-- JavaScript -->
    <script src="js/booking-history.js"></script>

</body>
</html>
